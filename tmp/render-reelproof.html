<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #ffffff;
      width: 590px;
      height: 1280px;
      padding: 36px 32px 30px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      color: #000000;
      overflow: hidden;
    }
    /* Top Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      margin-bottom: 24px;
    }
    .back-btn {
      font-size: 32px;
      font-weight: 300;
      color: #000;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .header-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .more-btn {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #000;
    }

    /* Thumbnail Card */
    .thumb-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .video-card {
      width: 220px;
      height: 320px;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 35%, #186355 0%, #083c33 70%, #03211c 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }
    .video-brand {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 10;
    }
    .video-brand img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
    }
    .video-brand span {
      font-size: 7px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .doc-img {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    .video-overlay-text {
      position: absolute;
      top: 105px;
      left: 16px;
      z-index: 10;
      text-align: left;
    }
    .video-overlay-text .line1 {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
    }
    .video-overlay-text .line2 {
      font-size: 19px;
      font-weight: 800;
      color: #38ef7d;
      line-height: 1.15;
    }
    .video-overlay-text .line3 {
      font-size: 19px;
      font-weight: 800;
      color: #38ef7d;
      line-height: 1.15;
    }

    /* Social icons row */
    .social-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      margin-bottom: 26px;
    }
    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .social-icon {
      width: 32px;
      height: 32px;
    }
    .social-count {
      font-size: 17px;
      font-weight: 600;
      color: #000000;
    }

    /* Tabs */
    .tabs-row {
      display: flex;
      align-items: center;
      border-bottom: 1.5px solid #ebebeb;
      margin-bottom: 34px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding-bottom: 14px;
      font-size: 19px;
      font-weight: 600;
      color: #737373;
    }
    .tab.active {
      color: #000000;
      border-bottom: 2.5px solid #000000;
      margin-bottom: -2px;
      font-weight: 700;
    }

    /* Section: Svodka */
    .section-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-icon {
      font-size: 18px;
      color: #737373;
      font-weight: 400;
    }

    /* 2x2 Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }
    .metric-card {
      background: #f7f7f9;
      border-radius: 18px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .metric-name {
      font-size: 16px;
      font-weight: 500;
      color: #616161;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-num {
      font-size: 34px;
      font-weight: 800;
      color: #000000;
      letter-spacing: -0.5px;
    }

    /* Section: Prosmotry v dinamike */
    .dynamics-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pills-row {
      display: flex;
      gap: 10px;
    }
    .pill {
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 600;
      border: 1px solid #e5e5e5;
      color: #737373;
    }
    .pill.active {
      background: #f0f0f2;
      color: #000000;
      border-color: #f0f0f2;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="back-btn">&#10094;</div>
    <div class="header-title-box">
      <div class="header-title">Статистика видео Reels</div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
        <polyline points="17 6 23 6 23 12"></polyline>
      </svg>
    </div>
    <div class="more-btn">&bull;&bull;&bull;</div>
  </div>

  <!-- Video Thumbnail Card -->
  <div class="thumb-wrap">
    <div class="video-card">
      <div class="video-brand">
        <img src="hilol-logo.jpg" alt="Hilol logo">
        <span>Hilol Med<br>Center</span>
      </div>

      <div class="video-overlay-text">
        <div class="line1">60 soniyada</div>
        <div class="line2">Obsessiv fobik</div>
        <div class="line3">nevroz</div>
      </div>

      <img src="doctor-glasses.png" class="doc-img" alt="Doctor with glasses">
    </div>
  </div>

  <!-- Social counts -->
  <div class="social-row">
    <div class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      <div class="social-count">4 тыс.</div>
    </div>

    <div class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <div class="social-count">2 тыс.</div>
    </div>

    <div class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 1l4 4-4 4"></path>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <path d="M7 23l-4-4 4-4"></path>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
      <div class="social-count">240</div>
    </div>

    <div class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
      <div class="social-count">2,3 тыс.</div>
    </div>

    <div class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <div class="social-count">589</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-row">
    <div class="tab active">Обзор</div>
    <div class="tab">Вовлеченность</div>
    <div class="tab">Аудитория</div>
  </div>

  <!-- Section: Svodka -->
  <div class="section-title">
    <span>Сводка</span>
    <span class="info-icon">&#9432;</span>
  </div>

  <!-- 4 Metrics -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-name">Просмотры</div>
      <div class="metric-num">239,099</div>
    </div>
    <div class="metric-card">
      <div class="metric-name">Охваченные аккаунты</div>
      <div class="metric-num">179,306</div>
    </div>
    <div class="metric-card">
      <div class="metric-name">Среднее время прос...</div>
      <div class="metric-num">27 с.</div>
    </div>
    <div class="metric-card">
      <div class="metric-name">Подписки</div>
      <div class="metric-num">1,394</div>
    </div>
  </div>

  <!-- Dinamika -->
  <div class="dynamics-title">
    <span>Просмотры в динамике</span>
    <span class="info-icon">&#9432;</span>
  </div>

  <div class="pills-row">
    <div class="pill active">Все</div>
    <div class="pill">Подписчики</div>
    <div class="pill">Неподписчики</div>
  </div>
</body>
</html>
